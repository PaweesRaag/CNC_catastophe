name: Python checks

on:
  push:
    paths:
      - "cnc-catastrophe-v2/tools/**"
      - "cnc-catastrophe-v2/tests/**"
      - "cnc-catastrophe-v2/requirements.txt"
      - ".github/workflows/python-checks.yml"
  pull_request:
    paths:
      - "cnc-catastrophe-v2/tools/**"
      - "cnc-catastrophe-v2/tests/**"
      - "cnc-catastrophe-v2/requirements.txt"
      - ".github/workflows/python-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnc-catastrophe-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python tools
        run: python -m py_compile tools/cnc_sender.py tools/svg_to_gcode.py
      - name: Run tests
        run: python -m pytest -q
